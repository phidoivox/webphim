[tools]
node = "24.21.0"
pnpm = "12.4.1"

[env]
# Tự động thêm CLI binaries local (như next, eslint) vào PATH để chạy trực tiếp không cần npx
_.path = ["{{config_root}}/frontend/node_modules/.bin"]

[settings]
# Cho phép mise đọc các tệp phiên bản chuẩn như .nvmrc, .node-version hoặc package.json
idiomatic_version_file = true

[tasks."frontend:dev"]
description = "Chạy Next.js frontend dev server"
dir = "frontend"
run = "pnpm dev"

[tasks."frontend:build"]
description = "Build ứng dụng Next.js frontend"
dir = "frontend"
run = "pnpm build"

[tasks."frontend:install"]
description = "Cài đặt dependencies cho frontend"
dir = "frontend"
run = "pnpm install"

[tasks."docker:build"]
description = "Build Docker images (điền .env.docker trước — NEXT_PUBLIC_* bake lúc build)"
run = "docker compose --env-file .env.docker build"

[tasks."docker:up"]
description = "Chạy stack Docker (tự migrate + cache config)"
run = "docker compose --env-file .env.docker up -d"

[tasks."docker:down"]
description = "Dừng stack Docker (giữ data DB)"
run = "docker compose --env-file .env.docker down"

[tasks."docker:logs"]
description = "Xem logs backend/nginx/frontend"
run = "docker compose --env-file .env.docker logs -f backend nginx frontend"

[tasks."docker:seed"]
description = "Seed dữ liệu nền Genre + Country (chạy 1 lần duy nhất)"
run = "docker compose --env-file .env.docker exec backend php artisan db:seed --class=GenreSeeder && docker compose --env-file .env.docker exec backend php artisan db:seed --class=CountrySeeder"
