[tools]
claude-code = { version = "latest", bin = "claude", checksum_expr = '"sha256:" + fromJSON(body).platforms[(os == "macos" ? "darwin" : (os == "windows" ? "win32" : "linux")) + "-" + arch].checksum', checksum_url = "https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases/{{ version }}/manifest.json", platforms = { windows-x64 = { bin = "claude.exe", url = "https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases/{{ version }}/win32-x64/claude.exe" } }, url = 'https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases/{{ version }}/{{ os(macos="darwin") }}-{{ arch() }}/claude', version_list_url = "https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases/latest" }
node = "24.18.1"
pnpm = "11.20.0"

[env]
# Tự động thêm CLI binaries local (như next, eslint) vào PATH để chạy trực tiếp không cần npx
_.path = ["{{config_root}}/frontend/node_modules/.bin"]

[settings]
# Cho phép mise đọc các tệp phiên bản chuẩn như .nvmrc, .node-version hoặc package.json
idiomatic_version_file = true

[tasks."frontend:dev"]
description = "Chạy Next.js frontend dev server"
dir = "frontend"
run = "pnpm dev"

[tasks."frontend:build"]
description = "Build ứng dụng Next.js frontend"
dir = "frontend"
run = "pnpm build"

[tasks."frontend:install"]
description = "Cài đặt dependencies cho frontend"
dir = "frontend"
run = "pnpm install"
