services:
  # ───── Nginx reverse proxy ─────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - backend-public:/app/public:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped

  # ───── Laravel API (php-fpm) ─────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env.docker
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Bind address cho Reverb server (khác REVERB_HOST=hostname public trong .env.docker)
      REVERB_SERVER_HOST: "0.0.0.0"
      LOG_CHANNEL: stderr
      LOG_STACK: stderr
      APP_ENV: production
      APP_DEBUG: "false"
    volumes:
      - storage:/app/storage
      - backend-public:/app/public
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "artisan", "tinker", "--execute", "echo 'ok';"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  # ───── Queue worker ─────
  queue:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env.docker
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_CHANNEL: stderr
      APP_ENV: production
      APP_DEBUG: "false"
    entrypoint: []
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90", "--sleep=3", "--max-jobs=1000"]
    user: "www-data"
    volumes:
      - storage:/app/storage
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ───── Laravel Reverb (WebSocket) ─────
  reverb:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env.docker
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Bind address cho Reverb server (khác REVERB_HOST=hostname public trong .env.docker)
      REVERB_SERVER_HOST: "0.0.0.0"
      REVERB_SERVER_PORT: 8080
      LOG_CHANNEL: stderr
      APP_ENV: production
      APP_DEBUG: "false"
    entrypoint: []
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    user: "www-data"
    expose:
      - "8080"
    volumes:
      - storage:/app/storage
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ───── Next.js frontend ─────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost/api
        NEXT_PUBLIC_REVERB_APP_KEY: ${REVERB_APP_KEY:?REVERB_APP_KEY is empty - copy .env.docker.example to .env.docker and fill it, then rebuild}
        NEXT_PUBLIC_REVERB_HOST: localhost
        NEXT_PUBLIC_REVERB_PORT: "80"
        NEXT_PUBLIC_REVERB_SCHEME: http
        NEXT_PUBLIC_SITE_URL: http://localhost
    environment:
      # Server-side internal API (container→nginx→fpm, not direct fpm)
      INTERNAL_API_URL: http://nginx/api
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ───── MySQL 8 ─────
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: webphim
      MYSQL_USER: webphim
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  # ───── Redis ─────
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  db-data:
  redis-data:
  storage:
  backend-public:
